{% set name = "pynndescent" %}
{% set version = "0.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 54f097a003bfdb917225e1bcf55c4027e283a37a2b5e3cae4b4aaf21197f6d1c

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools >=61.2
  run:
    - python
    - scikit-learn >=0.18
    - scipy >=1.0
    - numba >=0.55.0
    - llvmlite >=0.38
    - joblib >=0.11

test:
  source_files:
    - pynndescent/tests
  imports:
    - pynndescent
    - pynndescent.distances
    - pynndescent.graph_utils
    - pynndescent.hub_tree
    - pynndescent.hybrid_forest
    - pynndescent.kernels
    - pynndescent.optimal_transport
    - pynndescent.pynndescent_
    - pynndescent.rp_trees
    - pynndescent.search
    - pynndescent.search_graph
    - pynndescent.sparse
    - pynndescent.sparse_nndescent
    - pynndescent.utils
  commands:
    - pip check
    # pyargs does not work, tests folder not in the site-packages dir.
    - pytest -vv pynndescent/tests
  requires:
    - pip
    - pytest

about:
  home: https://github.com/lmcinnes/pynndescent
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Simple fast approximate nearest neighbor search
  description: |
    A Python nearest neighbor descent for approximate nearest neighbors.
    This is a relatively straightforward python implementation of
    Nearest Neighbor Descent for k-neighbor-graph construction and
    approximate nearest neighbor search.
  dev_url: https://github.com/lmcinnes/pynndescent
  doc_url: https://pynndescent.readthedocs.io

extra:
  recipe-maintainers:
    - lmcinnes
